<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CardScan App Icon">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgLight)"/>

  <!-- Business card body -->
  <rect x="80" y="156" width="352" height="220" rx="24" fill="url(#cardGrad)"/>

  <!-- Card stripe -->
  <rect x="80" y="208" width="352" height="48" fill="#ffffff" opacity="0.12"/>

  <!-- Scanner beam (animated appearance) -->
  <rect x="100" y="228" width="312" height="12" rx="6" fill="url(#beamGrad)" opacity="0.85"/>

  <!-- Corner scan brackets -->
  <path d="M100 186 L100 168 L118 168" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M412 168 L394 168 M412 168 L412 186" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M100 326 L100 344 L118 344" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M412 344 L394 344 M412 344 L412 326" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Contact data lines -->
  <rect x="116" y="280" width="140" height="12" rx="6" fill="#ffffff" opacity="0.5"/>
  <rect x="116" y="302" width="100" height="10" rx="5" fill="#ffffff" opacity="0.35"/>

  <!-- Active scan indicator dot -->
  <circle cx="412" cy="168" r="28" fill="url(#dotGrad)"/>
  <circle cx="412" cy="168" r="14" fill="#ffffff"/>
</svg>
